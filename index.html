<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <pre id="result" aria-live="polite"></pre>
  <script type="module">
    const form = document.querySelector("form");
    const result = document.querySelector("#result");
    const topicNames = {
      delivery: "доставка",
      pricing: "цена",
      other: "другое",
    };

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = document.querySelector("#message").value;
      result.textContent = "";

      let body;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        body = await reply.json();
      } catch {
        result.textContent = "Не удалось связаться с сервисом. Повторите попытку или ответьте клиенту вручную.";
        return;
      }

      if (!body || typeof body !== "object") {
        result.textContent = "Не удалось разобрать заявку автоматически. Ответьте клиенту вручную.";
        return;
      }

      if (body.status === "ready") {
        result.textContent = `Тема: ${topicNames[body.topic] ?? body.topic}\n\nЧерновик ответа:\n${body.draft}`;
        return;
      }

      if (body.status === "invalid_input") {
        result.textContent = "Введите текст заявки и попробуйте снова.";
        return;
      }

      result.textContent = "Не удалось разобрать заявку автоматически. Черновик очищен — ответьте клиенту вручную.";
    });
  </script>
</body>
</html>
